[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-datasafe-log-analytics-dashboards"
version = "2.2.0"
description = "Export OCI Data Safe audit events to OCI Logging and Log Analytics dashboards"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "UPL-1.0"}
dependencies = ["oci>=2.181.1,<3"]

[project.optional-dependencies]
function = ["fdk>=0.1.93,<1"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
datasafe-audit-export = "oci_datasafe_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]
