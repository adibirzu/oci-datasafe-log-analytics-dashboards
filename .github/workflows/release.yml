name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resource-manager-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_orm_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: oci-resource-manager-stack
          path: dist/oci-datasafe-log-analytics-stack.zip
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/oci-datasafe-log-analytics-stack.zip --clobber
