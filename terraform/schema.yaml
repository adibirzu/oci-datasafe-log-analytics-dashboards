title: "OCI Data Safe to Log Analytics"
description: "Deploy the Data Safe audit exporter, Logging route, fields/parser/source, unified dashboards, detection IAM and alarms, and baseline-drift notifications."
schemaVersion: 1.1.0
version: "2.2.0"
locale: "en"

variableGroups:
  - title: "Target compartments"
    variables:
      - tenancy_ocid
      - compartment_ocid
      - data_safe_compartment_ocid
      - region

  - title: "Function runtime"
    variables:
      - function_subnet_ocid
      - function_image
      - schedule_interval
      - custom_schedule_cron
      - custom_initial_lookback_minutes

  - title: "Log Analytics"
    variables:
      - create_log_analytics_log_group
      - log_analytics_log_group_ocid
      - deploy_log_analytics_content
      - deploy_dashboards

  - title: "Detections and notifications"
    variables:
      - enable_detections
      - detection_interval
      - enable_alarms
      - create_notification_topic
      - notification_topic_ocids
      - enable_datasafe_drift_events

  - title: "Security and deployment"
    variables:
      - deployment_name
      - include_sql_text
      - include_command_parameters
      - hash_client_ip
      - create_iam_resources
      - deploy_function

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    description: "Auto-populated by OCI Resource Manager."
    required: true

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Solution compartment"
    description: "Compartment for the Function, Logging, Connector Hub, and dashboards."
    required: true

  data_safe_compartment_ocid:
    type: string
    title: "Data Safe target compartment"
    description: "Compartment containing Data Safe registered targets, or the tenancy OCID when targets span compartment trees. Subcompartments are included."
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "Region where Data Safe and Log Analytics are enabled."
    required: true

  function_subnet_ocid:
    type: oci:core:subnet:id
    title: "Function subnet"
    description: "Existing regional subnet with access to OCI service endpoints."
    required: true
    dependsOn:
      compartmentId: compartment_ocid

  function_image:
    type: string
    title: "Function image"
    description: "Published multi-architecture OCIR image URL with a unique immutable version tag. OCI Functions does not accept a digest reference."
    required: true

  schedule_interval:
    type: enum
    title: "Function run interval"
    description: "Twelve hours is the default; choose a supported cadence or CUSTOM."
    enum:
      - "ONE_HOUR"
      - "SIX_HOURS"
      - "TWELVE_HOURS"
      - "ONE_DAY"
      - "CUSTOM"
    default: "TWELVE_HOURS"
    required: true

  custom_schedule_cron:
    type: string
    title: "Custom UTC cron"
    description: "Used only when Function run interval is CUSTOM."
    default: ""
    required: false
    visible:
      eq:
        - schedule_interval
        - "CUSTOM"

  custom_initial_lookback_minutes:
    type: number
    title: "Custom first-run lookback"
    description: "Minutes read on the first custom-schedule invocation."
    default: 750
    minimum: 15
    maximum: 10080
    required: false
    visible:
      eq:
        - schedule_interval
        - "CUSTOM"

  create_log_analytics_log_group:
    type: boolean
    title: "Create Log Analytics log group"
    description: "Recommended. Disable only to route into an existing group."
    default: true
    required: false

  log_analytics_log_group_ocid:
    type: string
    title: "Existing Log Analytics log group OCID"
    description: "Required only when creation of a dedicated group is disabled."
    default: ""
    required: false
    visible:
      not:
        - create_log_analytics_log_group

  deploy_log_analytics_content:
    type: boolean
    title: "Deploy fields, parser, and source"
    description: "Imports the versioned content package with overwrite semantics, without duplicating same-name content."
    default: true
    required: false

  deploy_dashboards:
    type: boolean
    title: "Deploy dashboards"
    description: "Imports all dashboard tabs and their generated saved searches with same-name replacement."
    default: true
    required: false

  enable_detections:
    type: boolean
    title: "Prepare scheduled detection policies and alarms"
    description: "Creates IAM and alarm resources. Reconcile saved searches and scheduled tasks with the documented post-apply SDK command."
    default: true
    required: false

  detection_interval:
    type: enum
    title: "Detection evaluation interval"
    enum:
      - "PT5M"
      - "PT10M"
      - "PT15M"
      - "PT30M"
      - "PT1H"
    default: "PT5M"
    required: true

  enable_alarms:
    type: boolean
    title: "Create Monitoring alarms"
    default: true
    required: false

  create_notification_topic:
    type: boolean
    title: "Create database-risk Notifications topic"
    default: true
    required: false

  notification_topic_ocids:
    type: array
    title: "Existing Notifications topic OCIDs"
    items:
      type: string
    default: []
    required: false

  enable_datasafe_drift_events:
    type: boolean
    title: "Route native Data Safe baseline drift events"
    description: "Routes Security Assessment and User Assessment baseline drift events to Notifications."
    default: true
    required: false

  deployment_name:
    type: string
    title: "Deployment prefix"
    default: "datasafe-audit"
    required: true

  include_sql_text:
    type: boolean
    title: "Export SQL text"
    description: "Privacy-sensitive. Disabled by default."
    default: false
    required: false

  include_command_parameters:
    type: boolean
    title: "Export SQL parameters"
    description: "Highly sensitive. Disabled by default."
    default: false
    required: false

  hash_client_ip:
    type: boolean
    title: "Pseudonymize client IP"
    description: "Recommended secure default; preserves grouping without exposing addresses."
    default: true
    required: false

  create_iam_resources:
    type: boolean
    title: "Create IAM policies"
    default: true
    required: false

  deploy_function:
    type: boolean
    title: "Deploy exporter Function"
    default: true
    required: false
